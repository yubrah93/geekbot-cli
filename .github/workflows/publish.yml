name: Publish to npm
on:
  release:
    types: [published]

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.11
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: bun install
      - run: bun run lint
      - run: bunx tsc --noEmit
      - name: Run tests
        run: |
          bun test tests/auth/ tests/http/ tests/output/ tests/utils/ tests/schemas/
          bun test tests/errors/error-handler.test.ts tests/errors/cli-error.test.ts tests/errors/not-found-helper.test.ts tests/errors/exit-codes.test.ts
          bun test tests/errors/error-handler-output.test.ts
          bun test tests/cli/commander-error.test.ts
          bun test tests/handlers/ tests/cli/commands/ tests/cli/globals.test.ts tests/cli/index.test.ts tests/ci/

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10.x; OIDC trusted publishing needs 11+.
      # The bundled npm 10.9.x in Node 22.22.2 is broken (missing
      # promise-retry), so we bootstrap npm 11 via corepack which
      # downloads a clean npm pack and doesn't depend on the bundled
      # npm resolver.
      - run: |
          corepack enable npm
          corepack prepare npm@11 --activate
          npm --version

      - name: Report Rollouts deployment start
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "publish"
          CHANGE_MONITOR_SERVICE: "geekbot-cli"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.workflow }}:${{ github.job }}:geekbot-cli:publish"
        run: |
          export DEPLOY_VERSION="$(git rev-parse HEAD)"
          bash .github/scripts/rollouts-reporter.sh bootstrap
          bash .github/scripts/rollouts-reporter.sh start
      - run: npm publish --provenance --access public
      - name: Report Rollouts deployment finish
        if: always()
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "publish"
          CHANGE_MONITOR_SERVICE: "geekbot-cli"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.workflow }}:${{ github.job }}:geekbot-cli:publish"
          CHANGE_MONITOR_OUTCOME: ${{ job.status }}
        run: bash .github/scripts/rollouts-reporter.sh finish
